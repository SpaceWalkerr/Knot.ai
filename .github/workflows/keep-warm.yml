name: keep-warm

# Render's free tier sleeps a web service after ~15 min idle; a cold start
# mid-demo breaks the live voice loop. This pings /health every ~10 min to keep
# it awake. Scheduled runs only fire from the default branch and can be delayed
# a few minutes under GitHub load — for the actual demo, also do a warm-up run
# ~5 min before, or upgrade the Render service to Starter.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://knot-ai.onrender.com/health || echo "000")
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "health check did not return 200"
          exit 0   # don't fail the workflow / spam notifications
